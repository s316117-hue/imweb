<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莓莓實驗室 🌸 | 超可愛空間</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>✨ 莓幫派 想加入嗎 ✨</h1>
        <p class="subtitle">一起探索最可愛的創意空間！</p>
        <div class="header-widgets">
            <button id="ai-toggle-btn" class="widget-btn">✋ 啟動 AI 魔法鏡頭</button>
            <div class="cheer-widget">
                <span class="cheer-icon">💖</span>
                <span class="cheer-label">魔法加油: </span>
                <span id="cheer-count" class="cheer-value">88</span>
            </div>
        </div>
    </header>

    <div class="labs-container">
        <a href="lab1/index.html" class="lab-card">
            <span class="lab-number">LAB 01</span>
            <div class="emoji-icon">🎵</div>
            <h2 class="lab-title">猜歌遊戲</h2>
            <p class="lab-desc">聽音樂來猜歌名！挑戰你的耳朵和音樂記憶～</p>
        </a>

        <a href="lab2/index.html" class="lab-card">
            <span class="lab-number">LAB 02</span>
            <div class="emoji-icon">📸</div>
            <h2 class="lab-title">照相亭</h2>
            <p class="lab-desc">打開相機，擺個可愛的姿勢，拍下美好的瞬間！</p>
        </a>

        <a href="lab3/index.html" class="lab-card">
            <span class="lab-number">LAB 03</span>
            <div class="emoji-icon">🎡</div>
            <h2 class="lab-title">雙享遊樂場</h2>
            <p class="lab-desc">一次擁有三個遊戲！來玩表情配對、羽球對決，還有水槍泡泡大戰！</p>
        </a>

        <a href="lab4/index.html" class="lab-card">
            <span class="lab-number">LAB 04</span>
            <div class="emoji-icon">💦</div>
            <h2 class="lab-title">水槍泡泡大戰</h2>
            <p class="lab-desc">發射夢幻泡泡擊退烏雲！挑戰你的反應與射擊技巧～</p>
        </a>

        <a href="lab5/index.html" class="lab-card">
            <span class="lab-number">LAB 05</span>
            <div class="emoji-icon">✨</div>
            <h2 class="lab-title">AI 魔法互動看板</h2>
            <p class="lab-desc">用你的手施展魔法！特效跟著手動，還能握拳加油！</p>
        </a>

    </div>

    <!-- AI Canvases & Overlays -->
    <canvas id="particle-canvas"></canvas>
    <canvas id="hand-canvas"></canvas>

    <div id="camera-preview-container" class="glass-card hidden">
        <div class="camera-header">
            <span class="cam-dot"></span>
            <span class="cam-title">AI CUTE CAMERA 🌸</span>
        </div>
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="scanner-overlay"><div class="scan-line"></div></div>
        </div>
        <div class="camera-footer">
            <span id="detection-status" class="status-msg">點擊上方按鈕啟動...</span>
        </div>
    </div>

    <!-- Custom Glowing Hand Cursor -->
    <div id="hand-cursor" class="hidden">
        <div class="cursor-dot"></div>
        <div class="cursor-ring-wrapper">
            <svg class="progress-ring" width="60" height="60">
                <circle class="progress-ring__circle-bg" stroke="rgba(255,183,197,0.3)" stroke-width="4" fill="transparent" r="24" cx="30" cy="30" />
                <circle class="progress-ring__circle" stroke="#FF8DA1" stroke-width="4" fill="transparent" r="24" cx="30" cy="30" stroke-dasharray="150.79" stroke-dashoffset="150.79" />
            </svg>
        </div>
    </div>

    <!-- External Script -->
    <script type="module" src="script.js"></script>
</body>

</html>
